<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Presentations</title>
    <meta name="description" content="Animated presentations, made with Remotion." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23a8322d'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #1b1511; --sea: #7a5234; --paper: #f3ede3; --muted: #6b5e52; --panel: #fbf7f0; --line: #e0d4c2;
        --bg: var(--paper); --text: var(--ink); }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #15110e; --text: #efe6d8; --panel: #1f1914; --line: #33291f; --muted: #a8998a; --sea: #d4a373; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 Inter, system-ui, sans-serif; }
      main { max-width: 1180px; margin: 0 auto; padding: 48px 16px 64px; }
      .eyebrow { letter-spacing: .3em; text-transform: uppercase; font-size: 13px; color: var(--sea); font-weight: 500; }
      h1 { font: 600 clamp(40px, 7vw, 76px)/1.02 "Cormorant Garamond", serif; margin: 8px 0 36px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 28px; }
      a.card { display: block; color: inherit; text-decoration: none; background: var(--panel); border: 1px solid var(--line);
        border-radius: 12px; overflow: hidden; transition: transform .15s ease, box-shadow .15s ease; }
      a.card:hover { transform: translateY(-3px); box-shadow: 0 18px 44px rgba(27, 21, 17, .25); }
      a.card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
      .card div { padding: 14px 18px 18px; }
      .card h2 { font: 600 30px/1.1 "Cormorant Garamond", serif; margin: 0; }
      .card p { margin: 4px 0 0; color: var(--muted); }
      .card .dates { font-size: 14px; color: var(--sea); letter-spacing: .08em; }
      footer { margin-top: 48px; font-size: 13px; color: var(--muted); }
      header { position: relative; }
      header .eyebrow { padding-right: 96px; }
      .lang-switch { position: absolute; top: 0; right: 0; display: flex; align-items: center; gap: 4px; font: 500 13px Inter, sans-serif;
        letter-spacing: .12em; color: var(--muted); }
      .lang-switch button { font: inherit; letter-spacing: inherit; background: none; border: 0; padding: 4px 6px; cursor: pointer;
        color: var(--muted); border-radius: 4px; }
      .lang-switch button.active { color: var(--text); text-decoration: underline; text-decoration-color: #a8322d;
        text-underline-offset: 5px; text-decoration-thickness: 2px; }
      .lang-switch button:hover { color: var(--text); }
    </style>
  </head>
  <body>
    <main>
      <!-- Every text has data-en and data-es; the script below shows one language (see the rule there). -->
      <header>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" lang="en" data-lang="en">EN</button><span aria-hidden="true">|</span><button type="button" lang="es" data-lang="es">ES</button>
        </div>
        <div class="eyebrow" data-en="Animated presentations" data-es="Presentaciones animadas">Animated presentations</div>
        <h1 data-en="Presentations" data-es="Presentaciones">Presentations</h1>
      </header>
      <!-- One card per presentation folder; the link is the folder name. Posters: poster.jpg (en), poster-es.jpg (es). -->
      <div class="grid">
        <a class="card" href="sorolla/">
          <img src="sorolla/poster.jpg" alt="Joaquín Sorolla presentation" data-en-alt="Joaquín Sorolla presentation" data-es-alt="Presentación sobre Joaquín Sorolla" loading="lazy" />
          <div>
            <h2>Joaquín Sorolla</h2>
            <p data-en="The Painter of Light" data-es="El pintor de la luz">The Painter of Light</p>
            <p class="dates">Valencia 1863 · Cercedilla 1923</p>
          </div>
        </a>
        <a class="card" href="velazquez/">
          <img src="velazquez/poster.jpg" alt="Diego Velázquez presentation" data-en-alt="Diego Velázquez presentation" data-es-alt="Presentación sobre Diego Velázquez" loading="lazy" />
          <div>
            <h2>Diego Velázquez</h2>
            <p data-en="The Painter of Painters" data-es="El pintor de pintores">The Painter of Painters</p>
            <p class="dates" data-en="Seville 1599 · Madrid 1660" data-es="Sevilla 1599 · Madrid 1660">Seville 1599 · Madrid 1660</p>
          </div>
        </a>
        <a class="card" href="kundera/">
          <img src="kundera/poster.jpg" alt="The Unbearable Lightness of Being presentation" data-en-alt="The Unbearable Lightness of Being presentation" data-es-alt="Presentación sobre La insoportable levedad del ser" loading="lazy" />
          <div>
            <h2 data-en="The Unbearable Lightness of Being" data-es="La insoportable levedad del ser">The Unbearable Lightness of Being</h2>
            <p>Milan Kundera</p>
            <p class="dates">1984</p>
          </div>
        </a>
      </div>
      <footer data-en="Made with Remotion. Images and music via Wikimedia Commons." data-es="Hecho con Remotion. Imágenes y música vía Wikimedia Commons.">Made with Remotion. Images and music via Wikimedia Commons.</footer>
    </main>
    <script>
      // Language: ?lang= in the URL, else the saved choice (shared with every presentation), else the browser.
      (() => {
        const KEY = "presentations.lang";
        const TITLE = { en: "Presentations", es: "Presentaciones" };
        const DESCRIPTION = {
          en: "Animated presentations, made with Remotion.",
          es: "Presentaciones animadas, hechas con Remotion.",
        };
        const isLang = (v) => v === "en" || v === "es";
        const saved = () => { try { return localStorage.getItem(KEY); } catch { return null; } };
        const fromUrl = new URLSearchParams(location.search).get("lang");
        const initial = isLang(fromUrl) ? fromUrl : isLang(saved()) ? saved()
          : (navigator.language || "").toLowerCase().startsWith("es") ? "es" : "en";

        const show = (lang) => {
          document.documentElement.lang = lang;
          document.title = TITLE[lang];
          document.querySelector('meta[name="description"]').content = DESCRIPTION[lang];
          document.querySelectorAll("[data-en]").forEach((el) => { el.textContent = el.dataset[lang]; });
          document.querySelectorAll("img[data-en-alt]").forEach((el) => { el.alt = el.getAttribute(`data-${lang}-alt`); });
          document.querySelectorAll("a.card").forEach((a) => {
            const folder = a.getAttribute("href").split("?")[0];
            a.setAttribute("href", `${folder}?lang=${lang}`);
            a.hreflang = lang;
            a.querySelector("img").src = `${folder}${lang === "es" ? "poster-es.jpg" : "poster.jpg"}`;
          });
          document.querySelectorAll(".lang-switch button").forEach((b) => {
            b.classList.toggle("active", b.dataset.lang === lang);
            b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
          });
          document.querySelector(".lang-switch").setAttribute("aria-label", lang === "es" ? "Idioma" : "Language");
        };

        document.querySelectorAll(".lang-switch button").forEach((b) => b.addEventListener("click", () => {
          const lang = b.dataset.lang;
          const url = new URL(location.href);
          url.searchParams.set("lang", lang);
          history.replaceState(history.state, "", url);
          try { localStorage.setItem(KEY, lang); } catch {}
          show(lang);
        }));
        show(initial);
      })();
    </script>
  </body>
</html>
