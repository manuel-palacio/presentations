# Static site on Fly.io: nginx serving the Remotion player page and the rendered MP4.
app = "velazquez-painter-of-painters"
primary_region = "arn"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
