# One site for all presentations: the home page at /, each presentation at /<folder>/.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;  # "/sorolla" -> "/sorolla/" without leaking the internal port behind Fly's proxy
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location ~ /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location ~* \.(jpg|png|m4a|mp4)$ { add_header Cache-Control "public, max-age=86400"; }
  location / { try_files $uri $uri/ =404; }
}
