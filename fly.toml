# One static site for all presentations (see build-site.sh): nginx, home page at /, each presentation at /<folder>/.
app = "palace-presentations"
primary_region = "arn"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
